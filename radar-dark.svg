<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
  <title id="title">SONA capability radar</title>
  <desc id="desc">A qualitative radar chart showing strong focus across web, desktop, audio, interface and 3D.</desc>
  <rect width="420" height="340" rx="12" fill="#0d1117"/>
  <g transform="translate(210 174)" stroke="#30363d" fill="none">
