    <polygon points="0,-90 86,-28 53,73 -53,73 -86,-28"/>
    <polygon points="0,-60 57,-19 35,49 -35,49 -57,-19"/>
    <line x1="0" y1="0" x2="0" y2="-120"/><line x1="0" y1="0" x2="114" y2="-37"/><line x1="0" y1="0" x2="70" y2="97"/><line x1="0" y1="0" x2="-70" y2="97"/><line x1="0" y1="0" x2="-114" y2="-37"/>
    <polygon points="0,-106 96,-31 60,83 -58,80 -101,-33" fill="#58a6ff" fill-opacity=".28" stroke="#58a6ff" stroke-width="3"/>
  </g>
